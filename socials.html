<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourtRhythm | Connect</title>
    <meta name="description" content="Connect with CourtRhythm on Instagram, Facebook, and LinkedIn.">
    <meta name="theme-color" content="#0b1326">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at top left, rgba(16, 185, 129, 0.16), transparent 28%),
          radial-gradient(circle at 80% 18%, rgba(59, 130, 246, 0.08), transparent 24%),
          radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.12), transparent 30%),
          #0b1326;
        color: #dae2fd;
        font-family: Inter, sans-serif;
      }

      .brand-mark {
        position: relative;
        width: clamp(3rem, 7vw, 4.7rem);
        height: clamp(3rem, 7vw, 4.7rem);
        border-radius: 1rem;
        background: linear-gradient(135deg, rgba(52, 211, 153, 1), rgba(16, 185, 129, 0.88), rgba(52, 211, 153, 0.76));
        box-shadow: 0 0 18px rgba(52,211,153,0.38), 0 0 36px rgba(16,185,129,0.12), inset 0 0 10px rgba(255,255,255,0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .brand-mark::before {
        content: "";
        position: absolute;
        inset: -18% -20%;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(52,211,153,0.5), transparent 62%);
        opacity: 0.8;
        z-index: 0;
      }

      .brand-mark svg {
        position: relative;
        z-index: 1;
        width: 60%;
        height: 60%;
      }

      .glass {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(148, 163, 184, 0.18);
        box-shadow: 0 30px 80px rgba(2, 6, 23, 0.72);
        backdrop-filter: blur(12px);
      }

      .social-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 1rem;
        border: 1px solid rgba(148,163,184,0.2);
        background: rgba(15, 23, 42, 0.75);
        color: #a7f3d0;
        transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      }

      .social-link:hover {
        transform: translateY(-1px);
        border-color: rgba(52,211,153,0.65);
        background: rgba(16, 185, 129, 0.08);
      }

      @media (max-width: 640px) {
        .social-grid {
          grid-template-columns: 1fr !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="w-full px-6 py-10">
      <div class="mx-auto w-full max-w-5xl glass rounded-[2rem] p-6 sm:p-8">
        <div class="mb-8 flex items-center justify-center gap-3">
          <div class="brand-mark">
            <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
              <circle cx="32" cy="14" r="4.5" fill="#ec6a06"></circle>
              <path d="M7 24.5H14L19 14.5L25.5 33.5L31.5 21L35.5 25.5H41" stroke="#003824" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </div>
          <div class="flex items-baseline tracking-tight">
            <span class="text-3xl font-extrabold text-white sm:text-5xl" style="font-family: 'Plus Jakarta Sans', sans-serif;">Court</span>
            <span class="ml-1 text-3xl font-black text-emerald-400 sm:text-5xl" style="font-family: 'Plus Jakarta Sans', sans-serif;">Rhythm</span>
          </div>
        </div>

        <div class="social-grid grid items-center gap-8 lg:grid-cols-[1.1fr_0.9fr]">
          <div class="text-center lg:text-left">
            <div class="mb-4 inline-flex items-center gap-2 rounded-full border border-emerald-400/30 bg-emerald-400/5 px-4 py-2 text-[0.68rem] font-semibold uppercase tracking-[0.26em] text-emerald-300">
              Stay in rhythm
            </div>

            <h1 class="mb-4 font-extrabold leading-none text-white" style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(2.2rem, 5vw, 4rem); letter-spacing: -0.07em;">
              Follow the energy.
            </h1>

            <p class="mx-auto max-w-xl text-base text-slate-300 lg:mx-0">
              Get updates, game moments, and community highlights from the CourtRhythm world.
            </p>

            <div class="mt-8 flex flex-wrap items-center justify-center gap-4 lg:justify-start">
              <a class="social-link" href="https://www.instagram.com/courtrhythm?stkn=MTdpY2szbGp2OGYxaQ==" target="_blank" rel="noreferrer" aria-label="Instagram">
                <svg viewBox="0 0 24 24" class="h-6 w-6 fill-current" aria-hidden="true">
                  <path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7Zm5 3.5A5.5 5.5 0 1 1 6.5 13 5.5 5.5 0 0 1 12 7.5Zm0 2A3.5 3.5 0 1 0 15.5 13 3.5 3.5 0 0 0 12 9.5Zm5.25-3.25a1.25 1.25 0 1 1-1.25 1.25 1.25 1.25 0 0 1 1.25-1.25Z"/>
                </svg>
              </a>

              <a class="social-link" href="https://www.facebook.com/share/19Qm8t7J7A/" target="_blank" rel="noreferrer" aria-label="Facebook">
                <svg viewBox="0 0 24 24" class="h-6 w-6 fill-current" aria-hidden="true">
                  <path d="M13.5 22v-8h2.6l.4-3h-3V7.2c0-.9.3-1.5 1.6-1.5H16V3.1c-.3 0-1.6-.1-3-.1-3 0-5 1.8-5 5.2V11H5.5v3h2.5v8h5.5Z"/>
                </svg>
              </a>

              <a class="social-link" href="https://www.linkedin.com/company/courtrhythm/" target="_blank" rel="noreferrer" aria-label="LinkedIn">
                <svg viewBox="0 0 24 24" class="h-6 w-6 fill-current" aria-hidden="true">
                  <path d="M6.94 8.5A1.56 1.56 0 1 1 6.94 5.4a1.56 1.56 0 0 1 0 3.1ZM5.5 9.8h2.9v9.7H5.5V9.8Zm5.1 0h2.8v1.3h.1c.4-.7 1.4-1.5 2.9-1.5 3 0 3.6 2 3.6 4.7v5.2h-2.9v-4.8c0-1.1 0-2.5-1.6-2.5s-1.8 1.2-1.8 2.4v4.9h-2.9V9.8Z"/>
                </svg>
              </a>
            </div>
          </div>

          <div class="rounded-[2rem] border border-slate-700/80 bg-slate-900/70 p-5 text-center">
            <div class="mb-3 text-[0.66rem] uppercase tracking-[0.28em] text-slate-400">Scan to connect</div>
            <img
              class="mx-auto block rounded-2xl border border-slate-700 bg-white p-3 shadow-[0_0_18px_rgba(52,211,153,0.18)]"
              src="https://api.qrserver.com/v1/create-qr-code/?size=190x190&margin=2&data=https%3A%2F%2Fwww.courtrhythm.com%2Fsocials.html"
              alt="CourtRhythm QR code"
              width="190"
              height="190"
            >
            <p class="mt-4 text-sm text-slate-300">We’re building premium sports experiences for players and fans.</p>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
