<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b1326;
      color: #dae2fd;
      font-family: Inter, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar {
      display: none;
    }

    @media (max-width: 640px) {
      main {
        min-height: auto;
        justify-content: flex-start !important;
        align-items: flex-start !important;
        padding-top: 1rem !important;
        padding-bottom: 4rem !important;
      }

      .mb-10 {
        margin-bottom: 2.25rem !important;
      }

      .mt-16 {
        margin-top: 2.25rem !important;
      }

      h1,
      h2 {
        letter-spacing: -0.06em;
      }
    }
  </style>
</head>

<body>

  <!-- Background Effects -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden">
    <div class="absolute -top-[25%] -left-[10%] w-[50vw] h-[50vw] rounded-full bg-emerald-400/5 blur-[120px]"></div>
    <div class="absolute -bottom-[20%] -right-[10%] w-[45vw] h-[45vw] rounded-full bg-orange-500/5 blur-[120px]"></div>
  </div>

  <main class="relative min-h-screen flex items-center justify-center px-6">

    <div class="text-center max-w-5xl">

      <!-- Logo -->
      <div class="flex items-center justify-center gap-3 mb-10">

        <div
          class="rounded-2xl bg-gradient-to-br from-emerald-400 via-emerald-500 to-emerald-300 shadow-[0_0_35px_rgba(78,222,163,0.3)] flex items-center justify-center p-2"
          style="width: clamp(3rem, 8vw, 5rem); height: clamp(3rem, 8vw, 5rem);">

          <svg class="w-full h-full" fill="none" viewBox="0 0 48 48">
            <circle cx="32" cy="14" r="4.5" fill="#ec6a06"></circle>

            <path
              d="M7 24.5H14L19 14.5L25.5 33.5L31.5 21L35.5 25.5H41"
              stroke="#003824"
              stroke-width="4.2"
              stroke-linecap="round"
              stroke-linejoin="round">
            </path>
          </svg>

        </div>

        <div class="flex items-baseline tracking-tight">

          <span
            class="font-extrabold text-white"
            style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(2rem, 6vw, 4.5rem);">
            Court
          </span>

          <span
            class="font-black text-emerald-400 ml-1"
            style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(2rem, 6vw, 4.5rem);">
            Rhythm
          </span>

        </div>

      </div>

      <!-- Headline -->
      <h1
        class="font-extrabold leading-tight mb-2"
        style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(2.5rem, 7vw, 4.5rem);">
        We are coming soon
      </h1>

      <h2
        class="font-extrabold bg-gradient-to-r from-emerald-400 via-emerald-300 to-emerald-500 bg-clip-text text-transparent"
        style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(2.5rem, 7vw, 4.5rem);">
        hang tight...
      </h2>

      <!-- Status Badge -->
      <div class="mt-16 inline-flex items-center gap-2 px-4 py-2 rounded-full bg-slate-800/70 backdrop-blur-md">

        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-400"></span>
        </span>

        <span class="text-xs tracking-[0.2em] uppercase text-slate-400 font-mono">
          STADIUM_UPLINK // STANDBY
        </span>

      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="fixed bottom-0 left-0 right-0 h-16 flex items-center px-6">

    <span class="text-xs text-slate-500">
      © 2026 CourtRhythm. All rights reserved.
    </span>

  </footer>

</body>
</html>
