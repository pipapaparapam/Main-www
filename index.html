<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CourtRhythm is the new way to bring energy, rhythm, and fun to your basketball warm-up. Join the launch and get notified.">
  <meta name="theme-color" content="#0b1326">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.courtrhythm.com/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.courtrhythm.com/">
  <meta property="og:title" content="CourtRhythm — Coming Soon">
  <meta property="og:description" content="A smarter, more engaging basketball warm-up is on the way. Join the CourtRhythm launch.">
  <meta property="og:site_name" content="CourtRhythm">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="CourtRhythm — Coming Soon">
  <meta name="twitter:description" content="A smarter, more engaging basketball warm-up is on the way. Join the CourtRhythm launch.">
  <title>CourtRhythm — The Future of Basketball Warm-Ups</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html, body { margin: 0; padding: 0; }

    body {
      background: #0b1326;
      color: #dae2fd;
      font-family: Inter, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background-image: radial-gradient(circle at 15% 15%, rgba(52, 211, 153, .08), transparent 30%), radial-gradient(circle at 85% 85%, rgba(6, 182, 212, .07), transparent 28%);
    }

    ::-webkit-scrollbar { display: none; }

    #countdown > div {
      background: linear-gradient(145deg, rgba(30, 41, 59, .72), rgba(15, 23, 42, .5));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 12px 32px rgba(15,23,42,.5);
      transition: transform .2s ease, border-color .2s ease;
    }

    #countdown > div:hover { transform: translateY(-3px); border-color: rgba(52, 211, 153, .55); }
    .status-wave { transform: translateY(.12em); }

    @media (max-width: 640px) {
      main { min-height: auto; justify-content: flex-start !important; align-items: flex-start !important; padding-top: .9rem !important; padding-bottom: 5rem !important; }
      .mb-10 { margin-bottom: 2.25rem !important; }
      .mt-16 { margin-top: 2.25rem !important; }
      h1, h2 { letter-spacing: -.05em; max-width: 100%; margin-left: auto; margin-right: auto; }
      h1 { font-size: clamp(1.55rem, 7vw, 2.2rem) !important; }
      h2 { font-size: clamp(1.65rem, 7.5vw, 2.35rem) !important; margin-bottom: 1.5rem !important; }
      .status-wave { gap: .22rem !important; transform: translateY(.2em); }
      .status-wave span { width: .36rem !important; height: .36rem !important; }
      .grid, .lg\:grid-cols-\[1\.15fr_0\.85fr\] { grid-template-columns: 1fr !important; }
      .max-w-xl { max-width: 100% !important; }
      .rounded-\[2rem\] { border-radius: 1.5rem !important; }
      #countdown { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; gap: .5rem !important; }
      #countdown > div { padding: .65rem .4rem !important; }
      #countdown > div > div:first-child { font-size: 1.4rem !important; }
      #countdown > div > div:last-child { letter-spacing: .14em !important; font-size: .52rem !important; }
      footer { position: static !important; height: auto !important; padding: 1rem 1.25rem 1.5rem !important; }
    }

    @media (max-width: 390px) {
      main { padding-top: .6rem !important; }
      .mb-10 { margin-bottom: 1.8rem !important; }
      h1, h2 { max-width: 100%; }
      h1 { font-size: 1.5rem !important; }
      h2 { font-size: 1.6rem !important; }
    }
  </style>
</head>

<body>
  <div class="fixed inset-0 pointer-events-none overflow-hidden" aria-hidden="true">
    <div class="absolute -top-[25%] -left-[10%] w-[50vw] h-[50vw] rounded-full bg-emerald-400/5 blur-[120px]"></div>
    <div class="absolute -bottom-[20%] -right-[10%] w-[45vw] h-[45vw] rounded-full bg-orange-500/5 blur-[120px]"></div>
  </div>

  <main class="relative min-h-screen flex items-center justify-center px-6 py-8">
    <div class="w-full max-w-6xl">
      <div class="flex items-center justify-center gap-3 mb-10">
        <div class="rounded-2xl bg-gradient-to-br from-emerald-400 via-emerald-500 to-emerald-300 shadow-[0_0_35px_rgba(78,222,163,0.3)] flex items-center justify-center p-2" style="width: clamp(3rem, 8vw, 5rem); height: clamp(3rem, 8vw, 5rem);" aria-label="CourtRhythm logo">
          <svg class="w-full h-full" fill="none" viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="32" cy="14" r="4.5" fill="#ec6a06"></circle>
            <path d="M7 24.5H14L19 14.5L25.5 33.5L31.5 21L35.5 25.5H41" stroke="#003824" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
        <div class="flex items-baseline tracking-tight">
          <span class="font-extrabold text-white" style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(2rem, 6vw, 4.5rem);">Court</span>
          <span class="font-black text-emerald-400 ml-1" style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(2rem, 6vw, 4.5rem);">Rhythm</span>
        </div>
      </div>

      <div class="grid gap-10 lg:grid-cols-[1.15fr_0.85fr] items-center">
        <div class="text-center lg:text-left">
          <div class="mb-5 inline-flex items-center gap-2 rounded-full border border-emerald-400/30 bg-emerald-400/5 px-4 py-2 text-[0.7rem] font-semibold uppercase tracking-[0.25em] text-emerald-300">New app release</div>
          <h1 class="font-extrabold leading-[0.95] text-white mb-3" style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(2.1rem, 4vw, 3.6rem);">We are coming soon</h1>
          <h2 class="font-extrabold bg-gradient-to-r from-emerald-400 via-emerald-300 to-emerald-500 bg-clip-text text-transparent mb-8 flex items-center justify-center gap-2 lg:justify-start" style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(2.2rem, 4.2vw, 4rem);">
            <span>hang tight</span>
            <span class="status-wave flex items-end gap-1" aria-label="loading">
              <span class="block h-2 w-2 rounded-full bg-emerald-400 animate-pulse" style="animation-delay: 0ms;"></span>
              <span class="block h-2 w-2 rounded-full bg-emerald-400 animate-pulse" style="animation-delay: 120ms;"></span>
              <span class="block h-2 w-2 rounded-full bg-emerald-400 animate-pulse" style="animation-delay: 240ms;"></span>
            </span>
          </h2>

          <div class="grid grid-cols-4 gap-3 max-w-xl mx-auto lg:mx-0" id="countdown" aria-label="Launch countdown" aria-live="polite">
            <div class="rounded-2xl border border-slate-700/80 bg-slate-900/50 px-3 py-4"><div class="text-3xl sm:text-4xl font-black text-white" id="days">00</div><div class="mt-2 text-[0.62rem] uppercase tracking-[0.2em] text-slate-400">Days</div></div>
            <div class="rounded-2xl border border-slate-700/80 bg-slate-900/50 px-3 py-4"><div class="text-3xl sm:text-4xl font-black text-white" id="hours">00</div><div class="mt-2 text-[0.62rem] uppercase tracking-[0.2em] text-slate-400">Hours</div></div>
            <div class="rounded-2xl border border-slate-700/80 bg-slate-900/50 px-3 py-4"><div class="text-3xl sm:text-4xl font-black text-white" id="minutes">00</div><div class="mt-2 text-[0.62rem] uppercase tracking-[0.2em] text-slate-400">Mins</div></div>
            <div class="rounded-2xl border border-slate-700/80 bg-slate-900/50 px-3 py-4"><div class="text-3xl sm:text-4xl font-black text-white" id="seconds">00</div><div class="mt-2 text-[0.62rem] uppercase tracking-[0.2em] text-slate-400">Secs</div></div>
          </div>
        </div>

        <div class="rounded-[2rem] border border-slate-700/80 bg-slate-900/60 p-5 shadow-[0_30px_80px_rgba(2,6,23,0.7)] backdrop-blur-md">
          <div class="mb-4 flex items-center justify-between"><div class="text-sm uppercase tracking-[0.25em] text-slate-400">Warm-up</div><div class="flex gap-2"><span class="h-3 w-3 rounded-full bg-emerald-400"></span><span class="h-3 w-3 rounded-full bg-yellow-400"></span><span class="h-3 w-3 rounded-full bg-red-400"></span></div></div>
          <div class="rounded-2xl border border-slate-700 bg-slate-800/80 p-4"><div class="text-center text-xs uppercase tracking-[0.22em] text-slate-400 mb-3">Game QR</div><img class="mx-auto block rounded-xl border border-slate-700 bg-white p-2" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https%3A%2F%2Fwww.courtrhythm.com%2F%3Fwarmup%3D1" alt="CourtRhythm warmup game QR code" width="220" height="220"></div>
          <div class="mt-5 rounded-2xl border border-slate-700/80 bg-slate-950/60 p-4"><div class="mb-2 text-sm text-slate-300">Activate your warm-up</div><button id="playWarmup" type="button" class="w-full rounded-xl bg-gradient-to-r from-emerald-400 to-cyan-400 px-4 py-3 font-semibold text-slate-950 transition hover:brightness-110">Play quick game</button></div>
          <form id="notifyForm" class="mt-5 space-y-3" action="https://formspree.io/f/mzezazea" method="POST"><label class="block text-left text-xs uppercase tracking-[0.2em] text-slate-400" for="email">Get notified</label><input id="email" type="email" name="email" placeholder="your@email.com" class="w-full rounded-xl border border-slate-700 bg-slate-950/70 px-3 py-3 text-sm text-white placeholder:text-slate-500 focus:border-emerald-400 focus:outline-none" required><button type="submit" class="w-full rounded-xl border border-emerald-400/40 bg-emerald-400/10 px-4 py-3 font-semibold text-emerald-200 transition hover:bg-emerald-400/15">Notify me</button><p id="formStatus" class="hidden text-sm text-emerald-300"></p></form>
        </div>
      </div>

      <div id="warmupGame" class="hidden mt-10 mx-auto max-w-xl rounded-[2rem] border border-emerald-400/30 bg-slate-900/60 p-5 text-center shadow-[0_20px_60px_rgba(16,185,129,0.12)]"><div class="text-xs uppercase tracking-[0.28em] text-emerald-300">Warmup challenge</div><div class="mt-3 text-2xl font-black text-white">Penalty shootout</div><div class="mt-2 text-sm text-slate-300">Tap the button as many times as you can before the timer ends.</div><div class="mt-5 flex items-center justify-center gap-4 text-sm text-slate-300"><div class="rounded-xl border border-slate-700 bg-slate-950/70 px-3 py-2">Score: <span id="scoreValue" class="font-bold text-emerald-300">0</span></div><div class="rounded-xl border border-slate-700 bg-slate-950/70 px-3 py-2">Time: <span id="timerValue" class="font-bold text-cyan-300">10</span>s</div></div><button id="shootBtn" type="button" class="mt-6 w-full rounded-xl bg-gradient-to-r from-emerald-400 to-cyan-400 px-4 py-3 text-lg font-bold text-slate-950 transition hover:brightness-110">Shoot!</button></div>
    </div>
  </main>

  <footer class="fixed bottom-0 left-0 right-0 h-16 flex items-center px-6"><span class="text-xs text-slate-500">© 2026 CourtRhythm. All rights reserved.</span></footer>

  <script>
    const targetDate = new Date('2026-10-31T00:00:00');
    const countdownNodes = { days: document.getElementById('days'), hours: document.getElementById('hours'), minutes: document.getElementById('minutes'), seconds: document.getElementById('seconds') };
    function updateCountdown() {
      const distance = targetDate - new Date();
      if (distance <= 0) { Object.values(countdownNodes).forEach(node => node.textContent = '00'); return; }
      countdownNodes.days.textContent = String(Math.floor(distance / 86400000)).padStart(2, '0');
      countdownNodes.hours.textContent = String(Math.floor(distance / 3600000) % 24).padStart(2, '0');
      countdownNodes.minutes.textContent = String(Math.floor(distance / 60000) % 60).padStart(2, '0');
      countdownNodes.seconds.textContent = String(Math.floor(distance / 1000) % 60).padStart(2, '0');
    }
    updateCountdown(); setInterval(updateCountdown, 1000);

    const notifyForm = document.getElementById('notifyForm');
    const formStatus = document.getElementById('formStatus');
    notifyForm.addEventListener('submit', function (event) {
      event.preventDefault();
      const emailInput = document.getElementById('email');
      if (!emailInput.value.trim()) { emailInput.focus(); return; }
      fetch(notifyForm.action, { method: 'POST', body: new FormData(notifyForm), headers: { Accept: 'application/json' } })
        .then(response => { if (!response.ok) throw new Error('Form submission failed'); formStatus.textContent = 'Thanks! We will keep you posted.'; formStatus.classList.remove('hidden'); notifyForm.reset(); })
        .catch(() => { formStatus.textContent = 'Something went wrong. Please try again later.'; formStatus.classList.remove('hidden'); formStatus.classList.add('text-red-300'); });
    });

    const warmupGame = document.getElementById('warmupGame');
    const playWarmup = document.getElementById('playWarmup');
    const shootBtn = document.getElementById('shootBtn');
    const scoreValue = document.getElementById('scoreValue');
    const timerValue = document.getElementById('timerValue');
    let score = 0, timeLeft = 10, timerId = null, warmupActive = false;
    function resetWarmup() { score = 0; timeLeft = 10; scoreValue.textContent = '0'; timerValue.textContent = '10'; warmupActive = false; clearInterval(timerId); shootBtn.disabled = false; shootBtn.textContent = 'Shoot!'; }
    function startWarmup() { resetWarmup(); warmupGame.classList.remove('hidden'); warmupActive = true; timerId = setInterval(function () { timeLeft -= 1; timerValue.textContent = String(Math.max(0, timeLeft)); if (timeLeft <= 0) { clearInterval(timerId); warmupActive = false; shootBtn.disabled = true; shootBtn.textContent = 'Challenge complete'; } }, 1000); }
    playWarmup.addEventListener('click', startWarmup);
    shootBtn.addEventListener('click', function () { if (!warmupActive) return; score += 1; scoreValue.textContent = String(score); shootBtn.textContent = score % 2 === 0 ? 'Goal!' : 'Nice!'; setTimeout(() => { shootBtn.textContent = 'Shoot!'; }, 220); });
    if (new URLSearchParams(window.location.search).get('warmup') === '1') startWarmup();
  </script>
</body>
</html>
